<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klean Image Landscaping</title>

<style>
:root{
  --green:#0f5f3a;
  --dark:#083b25;
  --gold:#c8a24a;
  --light:#e8f3ec;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  color:#222;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 6%;
  border-bottom:1px solid #eee;
}

.logo{
  height:70px;
}

nav a{
  margin-left:20px;
  font-weight:bold;
  text-decoration:none;
  color:#222;
}

.hero{
  background:linear-gradient(rgba(8,59,37,.7), rgba(8,59,37,.7));
  color:white;
  padding:80px 6%;
  text-align:center;
}

.hero img{
  height:110px;
  background:white;
  padding:10px;
  border-radius:6px;
  margin-bottom:20px;
}

.hero h1{
  font-size:48px;
  margin-bottom:10px;
}

.hero p{
  font-size:20px;
  margin-bottom:20px;
}

.btn{
  padding:14px 22px;
  background:var(--gold);
  color:#083b25;
  text-decoration:none;
  font-weight:bold;
  border-radius:4px;
  display:inline-block;
}

.contact-bar{
  background:var(--green);
  color:white;
  text-align:center;
  padding:20px;
}

.section{
  padding:60px 6%;
  max-width:900px;
  margin:auto;
  text-align:center;
}

form{
  background:white;
  padding:30px;
  border:1px solid #ddd;
  border-radius:8px;
}

input, textarea, select{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border:1px solid #ccc;
  border-radius:4px;
}

button{
  width:100%;
  padding:15px;
  background:var(--green);
  color:white;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

footer{
  background:var(--dark);
  color:white;
  text-align:center;
  padding:30px;
}
</style>
</head>

<body>

<header>
  <img src="klean_image_logo.jpg" class="logo">
  <nav>
    <a href="#estimate">Free Estimate</a>
    <a href="tel:3365551234">Call</a>
  </nav>
</header>

<section class="hero">
  <img src="klean_image_logo.jpg">
  <h1>Clean Work. Clear Standards.</h1>
  <p>Reliable landscaping for homes and businesses.</p>
  <a href="#estimate" class="btn">Request Estimate</a>
</section>

<div class="contact-bar">
  Call Now: <a href="tel:3365551234" style="color:white;">(336) 555-1234</a>
</div>

<section class="section">
  <h2>Services</h2>
  <p>Lawn care, landscaping, cleanups, and commercial property maintenance.</p>
</section>

<section class="section" id="estimate">
  <h2>Request a Free Estimate</h2>

  <!-- ✅ WORKING FORM -->
  <form action="https://formspree.io/f/mwvagnpz" method="POST">

    <input type="hidden" name="_subject" value="New Klean Image Estimate Request">

    <input type="text" name="name" placeholder="Your Name" required>
    <input type="tel" name="phone" placeholder="Phone Number" required>
    <input type="email" name="email" placeholder="Email">

    <select name="service">
      <option value="">Service Needed</option>
      <option>Lawn Maintenance</option>
      <option>Landscaping</option>
      <option>Cleanup</option>
      <option>Commercial</option>
    </select>

    <textarea name="message" placeholder="Tell us about your project"></textarea>

    <button type="submit">Submit Request</button>

  </form>
</section>

<footer>
  <p>Klean Image Landscaping</p>
  <p>(336) 555-1234</p>
</footer>

</body>
</html>
